<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vibe-fun — MCP Apps host emulator</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #2b2a28; color: #eee; display: grid; grid-template-columns: 1fr 380px; height: 100vh;
  }
  @media (max-width: 860px) { body { grid-template-columns: 1fr; height: auto; } }
  .stage { display: flex; flex-direction: column; min-height: 0; }
  .bar {
    display: flex; gap: 10px; align-items: center; padding: 10px 14px; background: #201f1d; border-bottom: 1px solid #3a3936;
    flex-wrap: wrap;
  }
  .bar h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 800; }
  .bar label { font-size: 12px; opacity: .8; }
  select, button {
    font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid #4a4844;
    background: #35332f; color: #eee; cursor: pointer;
  }
  button.primary { background: #8f7a66; border-color: #8f7a66; color: #f9f6f2; font-weight: 700; }
  .frame-holder { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 20px; overflow: auto; }
  iframe { border: 0; background: #faf8ef; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.4); width: 100%; max-width: 560px; }
  .side { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid #3a3936; background: #1b1a18; }
  .side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; opacity: .7; margin: 0; padding: 12px 14px; border-bottom: 1px solid #333; }
  .log { flex: 1; overflow: auto; padding: 10px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; }
  .msg { padding: 6px 8px; border-radius: 6px; margin-bottom: 6px; white-space: pre-wrap; word-break: break-word; }
  .in { background: #14321f; border-left: 3px solid #3fbf7f; }
  .out { background: #142238; border-left: 3px solid #4c7dff; }
  .meta { background: #2a2724; border-left: 3px solid #8f7a66; opacity: .85; }
  .m-method { font-weight: 700; }
  .foot { padding: 8px 12px; border-top: 1px solid #333; display: flex; gap: 8px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="bar">
      <h1>MCP Apps host emulator</h1>
      <label>App
        <select id="app">
          <option value="2048">2048</option>
          <option value="sudoku">Sudoku</option>
        </select>
      </label>
      <label id="diffWrap" hidden>Difficulty
        <select id="difficulty">
          <option value="easy">easy</option>
          <option value="medium">medium</option>
          <option value="hard">hard</option>
        </select>
      </label>
      <button class="primary" id="reload">Reload</button>
      <button id="wipe">Wipe saved state</button>
    </div>
    <div class="frame-holder"><iframe id="frame" sandbox="allow-scripts" title="app"></iframe></div>
  </div>
  <div class="side">
    <h2>JSON-RPC over postMessage</h2>
    <div class="log" id="log"></div>
    <div class="foot"><button id="clear">Clear log</button></div>
  </div>

<script>
/*
 * Reference MCP Apps *host* implementation for local testing.
 *
 * It renders an app in a sandboxed iframe and speaks the host half of the
 * SEP-1865 postMessage/JSON-RPC bridge:
 *   - answers  ui/initialize            (handshake)
 *   - sends    ui/notifications/tool-input  + ui/notifications/tool-result
 *   - answers  app/load-state           (app-layer persistence convention)
 *   - persists app/state-changed        (to this page's localStorage)
 *   - honors   ui/notifications/size-changed
 * A real host would persist to disk and gate UI-initiated tool calls; here we
 * keep it minimal so the app + protocol can be validated end to end.
 */
var frame = document.getElementById('frame');
var logEl = document.getElementById('log');
var appSel = document.getElementById('app');
var diffSel = document.getElementById('difficulty');
var diffWrap = document.getElementById('diffWrap');

var params = new URLSearchParams(location.search);
if (params.get('app')) appSel.value = params.get('app');

function currentApp() { return appSel.value; }
function storageKey() { return 'vibe-fun-host:' + currentApp(); }

function log(kind, label, obj) {
  var d = document.createElement('div');
  d.className = 'msg ' + kind;
  var head = document.createElement('div');
  head.className = 'm-method';
  head.textContent = label;
  d.appendChild(head);
  if (obj !== undefined) {
    var body = document.createElement('div');
    body.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj);
    d.appendChild(body);
  }
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

function send(msg) {
  frame.contentWindow.postMessage(msg, '*');
  if (msg.method) log('out', 'host -> app  ' + msg.method, msg.params);
  else log('out', 'host -> app  response #' + msg.id, msg.result);
}

function toolArgs() {
  return currentApp() === 'sudoku' ? { difficulty: diffSel.value } : {};
}

window.addEventListener('message', function (ev) {
  if (ev.source !== frame.contentWindow) return;
  var data = ev.data;
  if (!data || data.jsonrpc !== '2.0') return;

  // request from app (has id + method)
  if (data.method && typeof data.id !== 'undefined') {
    log('in', 'app -> host  ' + data.method + '  #' + data.id, data.params);
    if (data.method === 'ui/initialize') {
      send({
        jsonrpc: '2.0', id: data.id,
        result: {
          protocolVersion: '2026-07-28',
          hostInfo: { name: 'vibe-fun-host-emulator', version: '1.0.0' },
          capabilities: { extensions: { 'io.modelcontextprotocol/ui': {} } }
        }
      });
    } else if (data.method === 'app/load-state') {
      var raw = null;
      try { raw = localStorage.getItem(storageKey()); } catch (e) {}
      var state = null;
      try { state = raw ? JSON.parse(raw).state : null; } catch (e) {}
      send({ jsonrpc: '2.0', id: data.id, result: { state: state } });
    } else {
      send({ jsonrpc: '2.0', id: data.id, result: {} });
    }
    return;
  }

  // notification from app (method, no id)
  if (data.method) {
    log('in', 'app -> host  ' + data.method, data.params);
    if (data.method === 'ui/notifications/initialized') {
      // Simulate the host delivering the tool call context to the view.
      send({ jsonrpc: '2.0', method: 'ui/notifications/tool-input', params: { arguments: toolArgs() } });
      send({
        jsonrpc: '2.0', method: 'ui/notifications/tool-result',
        params: { content: [{ type: 'text', text: 'Opened ' + currentApp() }], structuredContent: {} }
      });
    } else if (data.method === 'app/state-changed') {
      try {
        localStorage.setItem(storageKey(), JSON.stringify({ appId: data.params.appId, schemaVersion: data.params.schemaVersion, state: data.params.state }));
      } catch (e) {}
    } else if (data.method === 'ui/notifications/size-changed') {
      var h = data.params && data.params.height;
      if (h) frame.style.height = Math.min(h + 4, 900) + 'px';
    }
    return;
  }
});

function loadApp() {
  var id = currentApp();
  diffWrap.hidden = id !== 'sudoku';
  logEl.innerHTML = '';
  log('meta', 'Loading /games/' + id + ' into sandboxed iframe...');
  fetch('/games/' + id, { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      frame.style.height = '640px';
      frame.srcdoc = html;
    })
    .catch(function (e) { log('meta', 'Failed to load app: ' + e.message); });
}

appSel.addEventListener('change', function () {
  var p = new URLSearchParams(location.search); p.set('app', currentApp());
  history.replaceState(null, '', '?' + p.toString());
  loadApp();
});
diffSel.addEventListener('change', loadApp);
document.getElementById('reload').addEventListener('click', loadApp);
document.getElementById('clear').addEventListener('click', function () { logEl.innerHTML = ''; });
document.getElementById('wipe').addEventListener('click', function () {
  try { localStorage.removeItem(storageKey()); } catch (e) {}
  log('meta', 'Wiped saved state for ' + currentApp() + '. Reload to start fresh.');
});

loadApp();
</script>
</body>
</html>
